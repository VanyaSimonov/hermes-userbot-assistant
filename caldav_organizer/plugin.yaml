name: caldav-organizer
label: CalDAV Organizer
kind: tools
version: 0.1.0
description: >
  Calendar + tasks for the Hermes agent over CalDAV (Radicale, Nextcloud, any
  CalDAV server). Gives the agent tools to read and write events and to-dos so
  it can run a shared family / team organizer.

  Per-profile by design: each Hermes profile points at its own CalDAV account
  via CALDAV_USERNAME / CALDAV_PASSWORD, so routed profiles (e.g. ivan, elena)
  see their own calendars, and a shared collection (default "shared") is the
  common family space. Reminders are left to the built-in ``cronjob`` toolset
  (enable it alongside this one): the agent schedules a cron job that messages
  the chat at the right time.

  Tools: calendar_list, calendar_add_event, calendar_delete_event, task_list,
  task_add, task_complete (toolset: ``calendar``).
author: VanyaSimonov
maintainer: VanyaSimonov
tier: community
requires_hermes: ">=0.21.0"
python_dependencies:
  # caldav 1.4+ pulls an unpublished 'icalendar-searcher' dep; pin to 1.3.x.
  - "caldav>=1.3,<1.4"
  - "icalendar>=5.0,<7"
requires_env:
  - name: CALDAV_USERNAME
    description: "CalDAV account username for this profile (e.g. ivan)"
    prompt: "CalDAV username"
    password: false
  - name: CALDAV_PASSWORD
    description: "CalDAV account password for this profile"
    prompt: "CalDAV password"
    password: true
optional_env:
  - name: CALDAV_URL
    description: "CalDAV base URL (default http://127.0.0.1:5232 — local Radicale)"
    prompt: "CalDAV base URL"
    password: false
  - name: CALDAV_SHARED_USER
    description: "Username/path of the shared collection owner (default: shared)"
    prompt: "Shared collection owner"
    password: false
  - name: CALDAV_TZ
    description: "IANA timezone for events without an explicit offset (default: Europe/Moscow)"
    prompt: "Timezone"
    password: false
